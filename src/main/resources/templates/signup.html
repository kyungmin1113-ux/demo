<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <style>
        body {
            background: #f9f9f9;
            color: #212529;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        .auth-wrap {
            max-width: 480px;
            margin: 72px auto;
            padding: 0 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.08);
            padding: 36px;
        }

        .auth-badge {
            background: #14b789;
            color: #ffffff;
            border-radius: 999px;
            display: inline-block;
            font-weight: 700;
            margin-bottom: 16px;
            padding: 8px 16px;
        }

        .btn-auth {
            background: #535da1;
            border: 0;
            color: #ffffff;
            font-weight: 700;
        }

        .btn-auth:hover {
            background: #14b789;
            color: #ffffff;
        }
    </style>
</head>
<body>
<main class="auth-wrap">
    <section class="auth-card">
        <span class="auth-badge">5주차 회원가입</span>
        <h1 class="h3 mb-3">회원가입</h1>
        <p class="text-muted mb-4">비밀번호는 BCrypt로 암호화되어 저장됩니다.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}">
            비밀번호가 일치하지 않습니다.
        </div>

        <form th:action="@{/signup}" th:object="${memberForm}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="아이디" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="비밀번호" required>
            </div>

            <div class="mb-3">
                <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="form-control" placeholder="비밀번호 확인" required>
            </div>

            <div class="mb-4">
                <label for="name" class="form-label">이름</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="이름 required>
            </div>

            <button type="submit" class="btn btn-auth w-100">
                <i class="bi-person-plus me-1"></i>회원가입
            </button>
        </form>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/}" class="text-decoration-none">메인으로</a>
            <a th:href="@{/login}" class="text-decoration-none">로그인</a>
        </div>
    </section>
</main>
</body>
</html>
